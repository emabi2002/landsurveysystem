[images]
  remote_images = [
    "https://source.unsplash.com/.*",
    "https://images.unsplash.com/.*",
    "https://ext.same-assets.com/.*",
    "https://ugc.same-assets.com/.*"
  ]

[build]
  command = "npm run build"
  # DO NOT set "publish" for SSR. The plugin manages it.

[[plugins]]
  package = "@netlify/plugin-nextjs"
